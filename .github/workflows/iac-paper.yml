name: IAC paper build
# ci: retrigger PR27 checks

on:
  pull_request:
    paths:
      - "paper/iac2026/**"
      - ".github/workflows/iac-paper.yml"
  push:
    branches:
      - main
    paths:
      - "paper/iac2026/**"
      - ".github/workflows/iac-paper.yml"

concurrency:
  group: iac-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/iac2026
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            lmodern \
            python3 \
            poppler-utils

      - name: Forbid strings in rendered manuscript sources
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mapfile -t manuscript_sources < <(
            find paper/iac2026 -type f \( -name '*.tex' -o -name '*.sty' \) -print | sort
          )
          if [ "${#manuscript_sources[@]}" -eq 0 ]; then
            echo "ERROR: no .tex/.sty manuscript sources found"
            exit 1
          fi
          echo "Scanning ${#manuscript_sources[@]} manuscript source files"
          fail=0
          for needle in \
            "Sydney" \
            "IAC-26,A3,IP,xxx" \
            "guaranteed safety" \
            "flight-ready system"
          do
            if grep -n -F -- "$needle" "${manuscript_sources[@]}"; then
              echo "ERROR: forbidden manuscript string found: $needle"
              fail=1
            fi
          done
          exit $fail

      - name: No tracked LaTeX build artifacts
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          tracked=$(git ls-files 'paper/iac2026/*.aux' 'paper/iac2026/*.bbl' 'paper/iac2026/*.blg' \
            'paper/iac2026/*.log' 'paper/iac2026/*.out' 'paper/iac2026/*.toc' 'paper/iac2026/*.pdf' || true)
          if [ -n "$tracked" ]; then
            echo "ERROR: tracked build artifacts must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no tracked LaTeX build artifacts"

      - name: Whitespace check
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Build PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Abstract limits
        run: python3 _count_abstract.py

      - name: Submission readiness (planning)
        run: python3 _check_submission_ready.py --allow-email-placeholder

      - name: US Letter page size
        run: |
          set -e
          info=$(pdfinfo main.pdf)
          echo "$info"
          size=$(echo "$info" | awk -F: '/^Page size:/ {print $2}' | xargs)
          echo "Parsed page size: $size"
          echo "$size" | grep -E -q '61[0-4](\.[0-9]+)?[[:space:]]*x[[:space:]]*79[0-4](\.[0-9]+)?'
          echo "OK: US Letter (~612 x 792 pts)"

      - name: Check LaTeX log
        run: |
          set -e
          fail=0
          for pat in "headheight is too small" "Undefined control sequence" "Citation .* undefined" "Reference .* undefined"; do
            if grep -E -n -- "$pat" main.log; then
              echo "ERROR: log matched: $pat"
              fail=1
            fi
          done
          overfull=$(grep -c 'Overfull \\hbox' main.log || true)
          echo "Overfull \\hbox count: $overfull"
          if [ "$overfull" -gt 0 ]; then
            grep -n 'Overfull \\hbox' main.log | head -n 20 || true
            echo "ERROR: overfull \\hbox is a blocker"
            fail=1
          fi
          exit $fail

      - name: PDF size and page count
        run: |
          set -e
          bytes=$(stat -c%s main.pdf)
          pages=$(pdfinfo main.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')
          echo "PDF bytes: $bytes"
          echo "PDF pages: $pages"
          if [ "$bytes" -ge 4500000 ]; then
            echo "WARNING: PDF exceeds 4.5 MB target ($bytes bytes)"
          fi
          if [ "$bytes" -ge 5000000 ]; then
            echo "ERROR: PDF must be under 5 MB ($bytes bytes)"
            exit 1
          fi
          if [ "$pages" -gt 15 ]; then
            echo "ERROR: PDF exceeds 15-page hard max ($pages pages)"
            exit 1
          fi
          echo "OK: size and page count"

      - name: Upload manuscript preview
        uses: actions/upload-artifact@v4
        with:
          name: iac2026-manuscript-preview
          path: |
            paper/iac2026/main.pdf
            paper/iac2026/main.log
          retention-days: 14
          if-no-files-found: error
