name: IAC paper build

on:
  pull_request:
    paths:
      - "paper/iac2026/**"
      - ".github/workflows/iac-paper.yml"
  push:
    branches:
      - main
    paths:
      - "paper/iac2026/**"
      - ".github/workflows/iac-paper.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper/iac2026
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            lmodern \
            python3

      - name: Forbid strings in paper/iac2026
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          fail=0
          for needle in "Sydney" "IAC-26,A3,IP,xxx" "guaranteed safety" "flight-ready system"; do
            if grep -R -n -F -- "$needle" paper/iac2026; then
              echo "ERROR: forbidden string found: $needle"
              fail=1
            fi
          done
          exit $fail

      - name: Build PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Abstract limits
        run: python3 _count_abstract.py

      - name: Check LaTeX log
        run: |
          set -e
          fail=0
          for pat in "headheight is too small" "Undefined control sequence" "Citation .* undefined" "Reference .* undefined"; do
            if grep -E -n -- "$pat" main.log; then
              echo "ERROR: log matched: $pat"
              fail=1
            fi
          done
          exit $fail
