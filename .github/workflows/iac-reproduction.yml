name: IAC reproduction harness

# Smoke-only guard for accidental download/GPU hooks in executable harness
# Python sources. This is NOT a security or data-exfiltration guarantee.

on:
  pull_request:
    paths:
      - "reproduction/iac2026/**"
      - "scripts/iac2026/**"
      - "scripts/benchmark_cv_core_speed.py"
      - "tests/iac2026/**"
      - "paper/iac2026/reproduction/**"
      - "paper/iac2026/CLAIM_EVIDENCE_LEDGER.md"
      - "paper/iac2026/EXPERIMENT_PROTOCOL.md"
      - ".github/workflows/iac-reproduction.yml"
  push:
    branches:
      - main
    paths:
      - "reproduction/iac2026/**"
      - "scripts/iac2026/**"
      - "scripts/benchmark_cv_core_speed.py"
      - "tests/iac2026/**"
      - "paper/iac2026/reproduction/**"
      - "paper/iac2026/CLAIM_EVIDENCE_LEDGER.md"
      - "paper/iac2026/EXPERIMENT_PROTOCOL.md"
      - ".github/workflows/iac-reproduction.yml"

permissions:
  contents: read

concurrency:
  group: iac-repro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          pip install -r reproduction/iac2026/requirements-ci.txt

      - name: Trailing whitespace check
        run: git diff --check HEAD^ HEAD || git diff --check origin/main...HEAD

      - name: Validate JSON schemas (Draft 2020-12)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          root = Path("reproduction/iac2026/schemas")
          for p in sorted(root.glob("*.json")):
              schema = json.loads(p.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
              print("schema ok", p)
          PY

      - name: Unit tests (software verification only)
        run: pytest -q tests/iac2026

      - name: CLI dry-run — audit fail-closed on example config
        run: |
          set +e
          python scripts/iac2026/audit_reproduction_inputs.py \
            --config reproduction/iac2026/configs/detection_reproduction.example.yaml \
            --run-id ci_audit_example
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: CLI dry-run — software-verification metrics
        run: |
          python scripts/iac2026/reproduce_detection_metrics.py \
            --config reproduction/iac2026/configs/detection_reproduction.synthetic.yaml \
            --software-verification \
            --run-id ci_metrics_synth
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          m = json.loads(Path("results/iac2026/reproduction/ci_metrics_synth/detection_metrics.json").read_text())
          schema = json.loads(Path("reproduction/iac2026/schemas/detection_metrics.schema.json").read_text())
          jsonschema.Draft202012Validator(schema).validate(m)
          assert m["evidence_class"] == "software_verification"
          assert m["eligible_for_claim_closure"] is False
          assert "0.894" not in json.dumps(m)
          print("metrics dry-run ok", m["primary_pr_metric_name"], m.get("average_precision"))
          PY

      - name: CLI dry-run — C07 software-verification
        run: |
          python scripts/benchmark_cv_core_speed.py \
            --config reproduction/iac2026/configs/c07_software_verification.example.yaml \
            --software-verification \
            --run-id ci_c07_core
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          s = json.loads(Path("results/iac2026/reproduction/ci_c07_core/timing_summary.json").read_text())
          schema = json.loads(Path("reproduction/iac2026/schemas/timing_result.schema.json").read_text())
          jsonschema.Draft202012Validator(schema).validate(s)
          assert s["evidence_class"] == "software_verification"
          assert s["eligible_for_claim_closure"] is False
          assert s["input_source"] == "synthetic"
          assert s["learned_depth_enabled"] is False
          assert s["autoencoder_enabled"] is False
          print("c07 dry-run ok", s.get("pipeline_id"), s.get("headline_fps"))
          PY

      - name: Guard — no download/GPU hooks in executable harness sources
        run: |
          set -e
          # Smoke-only: scans Python entrypoints. Not a security guarantee.
          # Do NOT include this workflow file (self-match) or Markdown/YAML docs.
          if grep -RIn -E "download.*nasa|CUDA_VISIBLE_DEVICES|nvidia-smi" \
            --include='*.py' scripts/iac2026 scripts/benchmark_cv_core_speed.py; then
            echo "ERROR: forbidden download/GPU hook in harness Python"
            exit 1
          fi
          echo "OK"

      - name: Job summary
        run: |
          {
            echo "## IAC reproduction CI"
            echo
            echo "Artifacts below are **software verification** only."
            echo "They are **not** scientific evidence and must not close C05–C07."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload software-verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reproduction-software-verification
          path: results/iac2026/reproduction/ci_*
          if-no-files-found: ignore
